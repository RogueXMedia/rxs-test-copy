<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | RogueX Services</title>
    <meta name="description" content="Thanks for contacting RogueX Services. We'll get back to you within 24 hours.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-primary: #2d8a4e;
            --green-dark: #1e5c35;
            --green-light: #4cb073;
            --teal: #3a9d8c;
            --red-accent: #d44a3a;
            --red-dark: #a83a2d;
            --gold: #f5c842;
            --gold-light: #ffe066;
            --cream: #faf9f5;
            --cream-warm: #fff8e7;
            --charcoal: #2d3436;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, var(--cream) 0%, var(--cream-warm) 100%);
            color: var(--charcoal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        html { overflow-x: hidden; }

        .sunburst {
            position: absolute;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 150%;
            height: 100%;
            background: radial-gradient(ellipse at center, var(--gold-light) 0%, var(--gold) 20%, transparent 50%);
            opacity: 0.2;
            z-index: 0;
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.3; transform: translateX(-50%) scale(1.05); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            background: white;
            border-radius: 30px;
            padding: 4rem 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .logo {
            height: 50px;
            width: auto;
            margin-bottom: 2rem;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--green-light), var(--green-primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3rem;
            animation: scaleIn 0.5s ease-out;
            box-shadow: 0 10px 30px rgba(45, 138, 78, 0.3);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        h1 .green {
            background: linear-gradient(135deg, var(--teal) 0%, var(--green-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .contact-info {
            background: var(--cream-warm);
            border-radius: 15px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
        }

        .contact-info p {
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .contact-info a {
            color: var(--green-dark);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: var(--red-accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--green-primary), var(--green-dark));
            color: white;
            box-shadow: 0 4px 20px rgba(45, 138, 78, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(45, 138, 78, 0.5);
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 600px) {
            .container {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="sunburst" aria-hidden="true"></div>
    <main class="container">
        <picture><source type="image/webp" srcset="/images/logo-text-80.webp"><img src="/images/logo-text-80.png" alt="RogueX Services" class="logo" width="451" height="80"></picture>
        
        <div class="checkmark" aria-hidden="true">✓</div>
        
        <h1><span class="green">Thank You!</span></h1>
        
        <p>Your message has been received! We're excited to help with your project. One of our team members will get back to you within 24 hours.</p>
        
        <div class="contact-info">
            <p><strong>Need immediate help?</strong></p>
            <p>📞 Call or text us 24/7: <a href="tel:+13307373699">330.737.3699</a></p>
            <p>📧 Email: <a href="mailto:go@roguexmedia.com">go@roguexmedia.com</a></p>
        </div>
        
        <a href="index.html" class="btn">← Back to Home</a>
        
        <p class="footer-text">Proudly serving Southern Oregon</p>
    </main>
<script src="/rx-events.js?v=1" defer></script>
</body>
</html>
